name = "optimalQuantumLinearSystems"
version = "0.1.0"
defaultTargets = ["OptimalQLS", "Verification"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f156f7abd91ac67adb22bf999e5a71ba22e22e41"

[[lean_lib]]
name = "OptimalQLS"
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency=false"]

[[lean_lib]]
name = "QuantumChannelStein"
srcDir = "vendor/first-paper"
roots = ["QuantumChannelStein.TraceNormBounds"]
globs = ["QuantumChannelStein.+"]
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency=false"]

[[lean_lib]]
name = "Verification"
roots = ["Verification.Solution", "Verification.Audit"]
globs = ["Verification.Statements", "Verification.Solution", "Verification.Audit"]
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency=false"]

[[lean_lib]]
name = "VerificationChallenge"
roots = ["Verification.Challenge"]
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency=false"]
